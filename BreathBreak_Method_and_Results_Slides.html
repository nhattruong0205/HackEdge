<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BreathBreak — Physiological ECG & PPG Fatigue Classification Presentation</title>
  <style>
    :root {
      --navy: #0c2340;
      --teal-dark: #0b5d69;
      --teal: #118a91;
      --amber: #f0a030;
      --coral: #e05a47;
      --green: #2e8b57;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #081729;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      align-items: center;
    }
    header {
      width: 100%;
      background: linear-gradient(90deg, var(--navy), var(--teal-dark), var(--teal));
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px solid var(--amber);
      position: sticky;
      top: 0;
      z-index: 20;
    }
    header h1 { font-size: 18px; font-weight: 700; letter-spacing: 0.3px; }
    header .controls { display: flex; gap: 10px; align-items: center; }
    button, a.btn {
      background: rgba(255,255,255,0.14);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.3);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.15s;
    }
    button:hover, a.btn:hover { background: rgba(255,255,255,0.28); }
    .stage {
      width: 100%;
      max-width: 1360px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .slide-frame {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 18px 45px rgba(0,0,0,0.55);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .slide-frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .thumbs {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 8px;
      width: 100%;
    }
    .thumb {
      border: 2px solid transparent;
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
      opacity: 0.65;
      transition: all 0.15s;
      background: #fff;
    }
    .thumb.active, .thumb:hover {
      border-color: var(--amber);
      opacity: 1;
      transform: translateY(-2px);
    }
    .thumb img { width: 100%; display: block; }
    @media print {
      header, .thumbs { display: none !important; }
      body { background: #fff; }
      .stage { max-width: 100%; padding: 0; }
    }
  </style>
</head>
<body>
  <header>
    <h1>🫀 BreathBreak — Physiological ECG & PPG Fatigue Classification Deck</h1>
    <div class="controls">
      <button onclick="prevSlide()">◀ Prev (←)</button>
      <span id="counter" style="font-size:14px;font-weight:700;min-width:75px;text-align:center;">Slide 1 / 10</span>
      <button onclick="nextSlide()">Next (→) ▶</button>
      <a class="btn" href="BreathBreak_Method_and_Results_Slides.pdf" target="_blank">📄 Open PDF Deck</a>
    </div>
  </header>

  <div class="stage">
    <div class="slide-frame">
      <img id="mainSlide" src="images/slides/slide_01.png" alt="Slide 1" />
    </div>
    <div class="thumbs" id="thumbBar"></div>
  </div>

  <script>
    const total = 10;
    let current = 1;
    const titles = [
      "1. Cover — BreathBreak Physiological ECG & PPG Method",
      "2. What the Model Does & Dual-Mode Architecture",
      "3. Clinical Signal Preprocessing Pipeline (P1–P8)",
      "4. Complete Feature Set (14 ECG/HRV + 4 Optical PPG)",
      "5. Sample Dataset Overview & Physiological Profiles",
      "6. Problems & Issues Encountered (and Solutions)",
      "7. Machine Learning Weights & Biological Logic",
      "8. Honest LORO Evaluation Results (100% Accuracy)",
      "9. Sample Prediction Walkthrough: Unseen Person_C (Mild Fatigue)",
      "10. Clinical Workflow, Privacy-Preserving HR Alerts & Summary"
    ];

    const thumbBar = document.getElementById("thumbBar");
    for (let i = 1; i <= total; i++) {
      const num = String(i).padStart(2, "0");
      const div = document.createElement("div");
      div.className = "thumb" + (i === 1 ? " active" : "");
      div.title = titles[i - 1];
      div.onclick = () => showSlide(i);
      div.innerHTML = `<img src="images/slides/slide_${num}.png" alt="Slide ${i}" />`;
      thumbBar.appendChild(div);
    }

    function showSlide(n) {
      current = Math.max(1, Math.min(total, n));
      const num = String(current).padStart(2, "0");
      document.getElementById("mainSlide").src = `images/slides/slide_${num}.png`;
      document.getElementById("counter").textContent = `Slide ${current} / ${total}`;
      document.querySelectorAll(".thumb").forEach((el, idx) => {
        el.classList.toggle("active", idx + 1 === current);
      });
    }
    function prevSlide() { if (current > 1) showSlide(current - 1); }
    function nextSlide() { if (current < total) showSlide(current + 1); }
    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === " ") nextSlide();
      if (e.key === "ArrowLeft") prevSlide();
    });
  </script>
</body>
</html>
